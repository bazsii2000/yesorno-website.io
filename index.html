<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./styles.css">
        
    </head> 
    <body>
        <div class="container">
            <div >
                <h1 class = "header_text">Szia Bambinóm, jó sorozatozást. Nemsokára találkozunk...:) Hazajöjjek hamarabb, ha rá tudsz menni az igenre akkor hamarabb hazajövök..hihi ? ( próbaként a nem-re is próbájl rámenni, ha nem sikerül az igenre..bocsii ) </h1>
            </div>
            <div class="gif_container">
                <img src="kepek/yesorno.gif" alt="Cute animated illustration">
            </div>
            <div class = "buttons">
                <button class="btn" id = "yesButton" onclick="nextPage()">Ne gyere haza, jó egyedül..:)</button>
                <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">Igen gyere haza</button>
                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }
                    
                    function moveButton() {
                        var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth) - 85;
                        var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight) - 48;
                        document.getElementById('noButton').style.left = `${x}px`;
                        document.getElementById('noButton').style.top = `${y}px`;
                    }
                </script> 
            </div>
        </div>
       
    </body> 
</html>
